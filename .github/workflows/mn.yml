name: Custom Windows 10 QEMU (Plug-and-Play + Hyper-V & 3D Acceleration)

on:
  workflow_dispatch:

jobs:
  run-win10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM, Mesa & Storage Tools
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & VirGL 3D Libraries ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-gui \
            qemu-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            virglrenderer-utils \
            ovmf \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            dosfstools \
            mtools

          echo "=== Enabling KVM & Render Permissions ==="
          sudo chmod 666 /dev/kvm || true
          sudo chmod 666 /dev/dri/renderD128 || true

          echo "=== Creating Main Virtual Disk (256GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 256G

      - name: 2. Download Windows 10 ISO
        run: |
          echo "=== [STEP 2/4] Downloading Windows 10 ISO ==="
          
          ISO_URL="https://archive.org/download/win10_22h2/Win10_22H2_English_x64.iso"
          
          echo "Downloading ISO to /tmp/win10.iso..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$ISO_URL" || wget -O /tmp/win10.iso "$ISO_URL"
          
          ls -lh /tmp/win10.iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          AUTH_KEY="${{ secrets.TAILSCALE_AUTHKEY }}"
          
          if [ -n "$AUTH_KEY" ]; then
            echo "Attempting auto-login with TAILSCALE_AUTHKEY..."
            sudo tailscale up --authkey="$AUTH_KEY" --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes || true
          fi

          TS_IP=$(tailscale ip -4 || true)
          if [ -z "$TS_IP" ]; then
            echo "=================================================="
            echo " ATTENTION: PLEASE VERIFY RUNNER IN TAILSCALE"
            echo "=================================================="
            
            timeout 15s sudo tailscale up --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes || true
            
            echo "=================================================="
            echo " Waiting for you to approve link above..."
            echo "=================================================="
            
            sudo tailscale up --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes > /dev/null 2>&1 &
            
            RETRIES=0
            while [ -z "$TS_IP" ] && [ $RETRIES -lt 60 ]; do
                TS_IP=$(tailscale ip -4 || true)
                sleep 3
                RETRIES=$((RETRIES+1))
            done
          fi

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale authentication failed or timed out!"
            exit 1
          fi

          echo "=================================================="
          echo " Tailscale Successfully Connected!"
          echo " Tailscale IP: $TS_IP"
          echo "=================================================="
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Windows 10 Machine ==="
          
          export QEMU_AUDIO_DRV=none

          # Все оптимизации Q35 + Hyper-V + 3D, но на нативных дисках/сети без лишних CD
          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -m 16384 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_synic,hv_stimer \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -device ich9-intel-hda -device hda-duplex \
            -device virtio-vga-gl \
            -display egl-headless \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 QEMU READY (All-In-One Optimized)"
          echo "=================================================="
          echo " OS Image     : Win10_22H2_English_x64.iso"
          echo " Architecture : Q35 PCIe + Hyper-V Enlightenments"
          echo " Display / 3D : VirtIO VGA GL (VirGL + EGL Headless)"
          echo " Drivers Setup: Native Plug-and-Play (No CD drivers required)"
          echo " CPU Spec     : 4 Cores (Host Passthrough)"
          echo " RAM          : 16 GB (16384 MB)"
          echo " Audio        : Intel HD Audio (ICH9-HDA)"
          echo " Storage Size : 256 GB Main Disk"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
