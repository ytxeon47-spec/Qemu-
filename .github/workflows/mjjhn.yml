name: )

on:
  workflow_dispatch:

jobs:
  run-win10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & ISO Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-gui \
            qemu-utils \
            genisoimage \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libvirglrenderer1 \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            p7zip-full \
            unzip

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (256GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 256G

          echo "=== Creating Emulated USB Flash Drive (32GB RAW) ==="
          qemu-img create -f raw /tmp/usb_flash_32G.img 32G

      - name: 2. Download Windows 10 ISO, SharedGL & Build Drivers CD-ROM
        run: |
          echo "=== [STEP 2/4] Downloading ISOs & SharedGL ==="
          
          WIN10_URL="https://archive.org/download/windows-10_20981236/Windows%2010.iso"
          VIRTIO_URL="https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/latest-virtio/virtio-win.iso"
          SHAREDGL_URL="https://github.com/dmaivel/sharedgl/releases/download/v0.10.0/sharedgl-v0.10.0-windows.zip"

          echo "Downloading Windows 10 ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$WIN10_URL" || wget -O /tmp/win10.iso "$WIN10_URL"

          echo "Downloading VirtIO Drivers ISO..."
          wget -O /tmp/virtio.iso "$VIRTIO_URL"

          echo "Downloading and Extracting SharedGL..."
          mkdir -p /tmp/sharedgl
          wget -O /tmp/sharedgl.zip "$SHAREDGL_URL"
          unzip -o /tmp/sharedgl.zip -d /tmp/sharedgl/

          # Создаём кастомный CD-диск с драйверами и SharedGL
          mkdir -p /tmp/custom_iso
          
          echo "Extracting VirtIO Drivers to CD..."
          7z x /tmp/virtio.iso -o/tmp/custom_iso/VirtIO_Drivers -y

          echo "Adding SharedGL to CD..."
          cp -r /tmp/sharedgl /tmp/custom_iso/SharedGL

          echo "Building Clean Drivers & SharedGL ISO..."
          genisoimage -o /tmp/software.iso -R -J /tmp/custom_iso

          ls -lh /tmp/win10.iso /tmp/software.iso /tmp/usb_flash_32G.img

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          AUTH_KEY="${{ secrets.TAILSCALE_AUTHKEY }}"
          
          if [ -n "$AUTH_KEY" ]; then
            echo "Attempting auto-login with TAILSCALE_AUTHKEY..."
            sudo tailscale up --authkey="$AUTH_KEY" --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes || true
          fi

          TS_IP=$(tailscale ip -4 || true)
          if [ -z "$TS_IP" ]; then
            echo "=================================================="
            echo " ATTENTION: PLEASE VERIFY RUNNER IN TAILSCALE"
            echo "=================================================="
            
            timeout 15s sudo tailscale up --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes || true
            
            echo "=================================================="
            echo " Waiting for you to approve link above..."
            echo "=================================================="
            
            sudo tailscale up --hostname="win10-qemu-runner-${{ github.run_id }}" --accept-routes > /dev/null 2>&1 &
            
            RETRIES=0
            while [ -z "$TS_IP" ] && [ $RETRIES -lt 60 ]; do
                TS_IP=$(tailscale ip -4 || true)
                sleep 3
                RETRIES=$((RETRIES+1))
            done
          fi

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale authentication failed or timed out!"
            exit 1
          fi

          echo "=================================================="
          echo " Tailscale Successfully Connected!"
          echo " Tailscale IP: $TS_IP"
          echo "=================================================="
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Windows 10 Machine ==="
          
          export QEMU_AUDIO_DRV=none

          # Запуск: 4 ядра + 16 ГБ ОЗУ (16384M) + 256ГБ ЖД + VirtIO + SharedGL CD + 32ГБ USB
          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -m 16384 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -drive file=/tmp/software.iso,index=2,media=cdrom \
            -drive file=/tmp/usb_flash_32G.img,id=usbflash,format=raw,if=none \
            -device usb-storage,drive=usbflash \
            -device ich9-intel-hda -device hda-duplex \
            -vga std \
            -vnc 127.0.0.1:0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 QEMU READY (16GB RAM / 256GB Disk / SharedGL)"
          echo "=================================================="
          echo " OS Image     : Windows 10 Official ISO"
          echo " Extra CD     : VirtIO Drivers + SharedGL v0.10.0"
          echo " USB Storage  : 32 GB Flash Drive"
          echo " CPU Config   : 4 Cores / 1 Thread per core"
          echo " RAM          : 16 GB (16384 MB)"
          echo " Network      : VirtIO Net PCI"
          echo " Storage Size : 256 GB Main Disk"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done
